<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="dashboard">

        <aside class="left">
            <div class="logo">
                Dashboard
            </div>

            <nav class="topbar">
                <button>Home</button>
                <button>Profile</button>
                <button>Messages</button>
                <button>History</button>
                <button>Tasks</button>
                <button>Communities</button>
            </nav>
            <nav class="bottombar">
                <button>Settings</button>
                <button>Support</button>
                <button>Privacy</button>
            </nav>
        </aside>

        <header class="top-section">

            <div class="searchbar">
                <input type="text" placeholder="Search...">
            </div>

            <div class="tr-name">
                Hatsune Miku
            </div>

            <div class="b-name">
                Hatsune Miku
            </div>

            <div class="header-buttons">
                <button>New</button>
                <button>Share</button>
                <button>More</button>
            </div>

        </header>

        <main class="middle">
        </main>

    </div>
</body>
</html>
