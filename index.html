<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="dashboard">

        <aside class="left">
            <div class="logo">
                Dashboard
            </div>

            <nav class="topbar">
                <button>Home</button>
                <button>Profile</button>
                <button>Messages</button>
                <button>History</button>
                <button>Tasks</button>
                <button>Communities</button>
            </nav>
            <nav class="bottombar">
                <button>Settings</button>
                <button>Support</button>
                <button>Privacy</button>
            </nav>
        </aside>

        <header class="top-section">

            <div class="searchbar">
                <input type="text" placeholder="Search...">
            </div>

            <div class="tr-name">
                Hatsune Miku
            </div>

            <div class="b-name">
                Hatsune Miku
            </div>

            <div class="header-buttons">
                <button>New</button>
                <button>Share</button>
                <button>More</button>
            </div>

        </header>

        
<main class="middle-section">

    <div class="projects-section">
        <h2>Your Projects</h2>

        <div class="project-grid">

            <div class="project-card">
                <h3>Goku/h3>
                <p>kamehameha</p>
            </div>

            <div class="project-card">
                <h3>krillin</h3>
                <p>Distructo Disk</p>
            </div>

            <div class="project-card">
                <h3>Yamcha</h3>
                <p>Wolf fang fist</p>
            </div>

            <div class="project-card">
                <h3>Bulma</h3>
                <p>money??</p>
            </div>

            <div class="project-card">
                <h3>Oolong/h3>
                <p>Creep...</p>
            </div>

            <div class="project-card">
                <h3>Roshi</h3>
                <p>CREEP!!!</p>
            </div>

        </div>
    </div>

    <div class="right-section">
        <div class="announcements-section">
            <h2>Announcements</h2>
            <div class="announcement-card"></div>
        </div>
        <div class="trending-section">
            <h2>Trending</h2>
            <div class="trending-card"></div>
        </div>

    </div>
</body>
</html>
